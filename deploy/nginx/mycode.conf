# Include this file from the http{} context. The map must not be placed inside
# either server block because it is shared by HTTP, SSE, and WebSocket proxying.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name mycode.icu;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mycode.icu;

    ssl_certificate /etc/letsencrypt/live/mycode.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mycode.icu/privkey.pem;

    # The old Phase 1 public path remains a compatibility redirect only.
    location = /mycode {
        return 301 /web/;
    }

    location ^~ /mycode/ {
        rewrite ^/mycode/(.*)$ /web/$1 permanent;
    }

    location = /web {
        return 301 /web/;
    }

    # Keep the URI unchanged so FastAPI receives /web/api/... directly.
    # The same headers also preserve WebSocket Upgrade for /terminal.
    location /web/api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Vite emits assets relative to /web/; alias maps that URL prefix to dist/.
    # try_files provides the Vue history fallback for /web/?session=... routes.
    location /web/ {
        alias /opt/mycode-web/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /web/index.html;
    }
}
