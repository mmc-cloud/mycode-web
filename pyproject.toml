[project]
name = "mycode-web-server"
version = "0.1.0"
description = "Local FastAPI and Vue demo for MyCode"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35,<1",
    "watchfiles>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
